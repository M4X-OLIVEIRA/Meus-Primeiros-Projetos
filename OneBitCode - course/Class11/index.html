<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalação time de futebol</title>
</head>

<body>
    <h1>Cadastro de jogadores</h1>

    <label>
        <input placeholder="Nome do jogador" id="nomeJogador" type="text">
    </label>
    <label>
        <input placeholder="Posição do jogador" id="posicaoJogador" type="text">
    </label>
    <label>
        <input placeholder="Numero da camisa" id="numeroJogador" type="text">
    </label>

    <button id="addJogador">Adicionar um jogador</button>
    <button id="removeJogador">Excluir um jogador</button>

    <h2>Jogadores escalados</h2>
    <ul id="listaJogadores"></ul>

    <script src="script.js"></script>
</body>



</html>
